# Based on kyutai-labs/moshi-finetune example/moshi_7B.yaml (verified 2026-09-17).
data:
  train_data: "outputs/korean_train/moshi.jsonl"
  eval_data: "outputs/korean_eval/moshi.jsonl"
  shuffle: true
moshi_paths:
  hf_repo_id: "kyutai/moshiko-pytorch-bf16"
full_finetuning: false
lora:
  enable: true
  rank: 128
  scaling: 2.0
  # Korean tokenizer evaluation is required before enabling this.
  ft_embed: false
first_codebook_weight_multiplier: 100.0
text_padding_weight: 0.5
duration_sec: 100
batch_size: 1
num_microbatches: 4
max_steps: 2000
gradient_checkpointing: true
optim:
  lr: 2.0e-6
  weight_decay: 0.1
  pct_start: 0.05
seed: 42
log_freq: 1
eval_freq: 100
do_eval: true
do_ckpt: true
ckpt_freq: 100
save_adapters: true
run_dir: "runs/korean_moshi_lora"
